<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Parcel lost in transit</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #374151;
      text-align: center;
      padding: 16px;
    }
    main {
      max-width: 480px;
    }
    .parcel {
      font-size: 72px;
    }
    .code {
      font-size: 110px;
      font-weight: bold;
      margin: 0;
      color: #db2777;
    }
    h1 {
      margin: 0 0 16px;
      color: #374151;
    }
    p {
      color: #6b7280;
      line-height: 1.5;
    }
    .slip {
      margin: 24px auto;
      padding: 16px;
      background: #fce7f3;
      border: 2px dashed #db2777;
      border-radius: 12px;
      text-align: left;
      font-family: monospace;
      color: #374151;
    }
    a {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 28px;
      background: #db2777;
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
    }
    a:hover {
      background: #be185d;
    }
  </style>
</head>
<body>
  <main>
    <div class="parcel">📦</div>
    <p class="code">404</p>
    <h1>Ceci n'est pas une page</h1>
    <p>Oops! This parcel took a wrong turn somewhere between Lagos and Kigali.</p>
    <p>Our dispatcher checked every warehouse, but the page you ordered was never shipped.</p>
    <div class="slip">
      Tracking ID: 404-NOT-FOUND<br>
      Status: Lost in transit<br>
      Last seen: Somewhere on the corridor
    </div>
    <a href="/">Reroute me</a>
  </main>
</body>
</html>
